name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**/*.dvc'
      - '.dvc/config'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'deploy/**'
      - 'params.yaml'
      - 'requirements.txt'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

permissions:
  contents: read

# Serialize deployments that share the same current model.
concurrency:
  group: income-model-main
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  SERVER_SECURITY_GROUP_ID: sg-0a6755f4ddebc9425

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Pull training and evaluation data
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model
        run: python src/train.py
      - name: Read report
        id: read_report
        run: |
          python - <<'PY'
          import json
          import os
          with open("outputs/report.json") as handle:
              report = json.load(handle)
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"f1={report['f1_score']}\n")
          print(report)
          PY
      - name: Save candidate model and report
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/model.joblib
            outputs/report.json
          if-no-files-found: error

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check F1 threshold
        env:
          MODEL_F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PY'
          import math
          import os
          f1 = float(os.environ["MODEL_F1"])
          if not math.isfinite(f1) or not 0.65 <= f1 <= 1.0:
              raise SystemExit(f"FAILED: f1_score {f1} does not meet the 0.65 threshold.")
          print(f"PASSED: f1_score={f1:.4f}")
          PY

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: candidate
      - name: Install S3 SDK
        run: pip install boto3==1.43.106
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Temporarily allow runner SSH
        id: runner_ssh
        run: python deploy/runner_ssh.py open
      - name: Publish approved model and report to S3
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PY'
          import os
          import boto3
          client = boto3.client("s3")
          bucket = os.environ["ARTIFACT_BUCKET"]
          client.upload_file("candidate/models/model.joblib", bucket, "artifacts/current/model.joblib")
          client.upload_file("candidate/outputs/report.json", bucket, "artifacts/current/report.json")
          PY
      - name: Copy API code to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: src/serve.py
          target: /home/${{ secrets.SERVER_USER }}/
      - name: Restart API and check health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            sudo systemctl restart income-api
            curl --fail --silent --show-error --retry 12 --retry-connrefused --retry-delay 5 --max-time 10 http://127.0.0.1:8080/healthz
      - name: Remove temporary runner SSH rule
        if: ${{ always() && steps.runner_ssh.outputs.rule_id != '' }}
        env:
          SSH_RULE_ID: ${{ steps.runner_ssh.outputs.rule_id }}
        run: python deploy/runner_ssh.py close
